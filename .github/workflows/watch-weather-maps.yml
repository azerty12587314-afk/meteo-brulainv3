name: Watch weather map freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "27 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: watch-weather-map-freshness
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Vérifier l'âge de la dernière génération
        id: freshness
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          path = Path("maps/manifest.json")
          stale = True
          if path.exists():
              data = json.loads(path.read_text(encoding="utf-8"))
              raw = data.get("generatedAt")
              if raw:
                  generated = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  age = datetime.now(timezone.utc) - generated
                  stale = age > timedelta(hours=8)
                  print("Dernière génération :", generated.isoformat())
                  print("Âge :", age)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"stale={'true' if stale else 'false'}\n")
          PY

      - name: Relancer la génération si les cartes sont trop anciennes
        if: steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Les cartes ont plus de 8 heures : lancement du workflow de génération."
          gh workflow run generate-maps.yml --ref "${{ github.event.repository.default_branch }}"
