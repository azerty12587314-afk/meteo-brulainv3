name: Update water restrictions
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4,10,16,22 * * *"
permissions:
  contents: write
concurrency:
  group: meteo-site-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch VigiEau restrictions
        env:
          SITE_LATITUDE: ${{ vars.SITE_LATITUDE }}
          SITE_LONGITUDE: ${{ vars.SITE_LONGITUDE }}
          SITE_NAME: ${{ vars.SITE_NAME }}
          SITE_INSEE: ${{ vars.SITE_INSEE }}
        run: python scripts/fetch_water_restrictions.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/water-restrictions.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update water restrictions"
          publish_with_rebase() {
            local branch="${GITHUB_REF_NAME:-main}"
            for attempt in 1 2 3 4 5; do
              echo "Tentative de publication ${attempt}/5 sur ${branch}"
              git pull --rebase origin "$branch"
              if git push origin "HEAD:$branch"; then
                return 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 8))
            done
            echo "Échec de la publication après 5 tentatives." >&2
            return 1
          }
          publish_with_rebase
