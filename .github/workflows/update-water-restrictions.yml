name: Update water restrictions
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4,10,16,22 * * *"
permissions:
  contents: write
concurrency:
  group: meteo-site-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch VigiEau restrictions
        env:
          SITE_LATITUDE: ${{ vars.SITE_LATITUDE }}
          SITE_LONGITUDE: ${{ vars.SITE_LONGITUDE }}
          SITE_NAME: ${{ vars.SITE_NAME }}
          SITE_INSEE: ${{ vars.SITE_INSEE }}
        run: python scripts/fetch_water_restrictions.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/water-restrictions.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update water restrictions"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
