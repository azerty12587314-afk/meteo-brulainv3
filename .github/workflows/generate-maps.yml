name: Generate weather maps

on:
  workflow_dispatch:
  schedule:
    # Toutes les 6 heures
    - cron: "15 */6 * * *"

permissions:
  contents: write

concurrency:
  group: generate-weather-maps
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gdal-bin \
            libgdal-dev \
            libproj-dev \
            proj-data \
            proj-bin \
            libgeos-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            matplotlib \
            numpy \
            scipy \
            pandas \
            pillow \
            requests \
            xarray \
            netCDF4 \
            cartopy \
            pyproj \
            shapely \
            eccodes

      - name: Create output folders
        run: |
          mkdir -p maps
          mkdir -p maps/gfs
          mkdir -p maps/icon
          mkdir -p maps/ecmwf
          mkdir -p maps/arpege
          mkdir -p maps/arome

      - name: Generate GFS and ICON-EU maps
        run: |
          python scripts/render_maps.py

      - name: Show generated files
        run: |
          find maps -type f

      - name: Commit generated maps
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(maps): update forecast maps"
          file_pattern: |
            maps/**
