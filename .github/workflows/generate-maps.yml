name: Generate weather maps

on:
  workflow_dispatch:
    inputs:
      max_hour:
        description: "Limite facultative pour un test manuel (laisser vide pour les échéances automatiques)"
        required: false
        default: ""
      step:
        description: "Pas uniforme facultatif pour un test manuel (laisser vide pour le calendrier hybride)"
        required: false
        default: ""
  schedule:
    - cron: "35 1,7,13,19 * * *"

permissions:
  contents: write

concurrency:
  group: generate-weather-maps
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Afficher le contexte d'exécution
        run: |
          echo "Déclenchement : ${{ github.event_name }}"
          echo "Début UTC : $(date -u --iso-8601=seconds)"
          echo "Branche : ${GITHUB_REF_NAME}"

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-maps.txt

      - name: Installer les bibliothèques système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libeccodes0 \
            libeccodes-dev \
            libeccodes-tools \
            libgeos-dev \
            libproj-dev \
            proj-data \
            proj-bin
          sudo rm -rf /var/lib/apt/lists/*

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-maps.txt

      - name: Vérifier les dépendances
        run: |
          python --version
          python -c "import matplotlib, numpy, xarray, cfgrib, eccodes, cartopy, ecmwf.opendata; print('Dépendances OK')"

      - name: Générer les cartes GFS, ICON-EU et ECMWF IFS
        env:
          MAX_HOUR: ${{ github.event.inputs.max_hour }}
          MAP_STEP: ${{ github.event.inputs.step }}
        run: |
          args=(--output . --models gfs icon_eu ecmwf)

          if [[ -n "${MAX_HOUR:-}" ]]; then
            args+=(--max-hour "$MAX_HOUR")
          fi

          if [[ -n "${MAP_STEP:-}" ]]; then
            args+=(--step "$MAP_STEP")
          fi

          python scripts/render_maps.py "${args[@]}"

      - name: Vérifier le manifeste et les images
        run: python scripts/validate_maps.py

      - name: Vérifier la fraîcheur des cycles
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          manifest = json.loads(Path("maps/manifest.json").read_text(encoding="utf-8"))
          now = datetime.now(timezone.utc)
          limits = {
              "gfs": timedelta(hours=18),
              "icon_eu": timedelta(hours=18),
              "ecmwf": timedelta(hours=30),
          }
          for name, model in manifest.get("models", {}).items():
              raw = model.get("run")
              if not raw:
                  raise SystemExit(f"Run absent pour {name}")
              run = datetime.fromisoformat(raw.replace("Z", "+00:00"))
              age = now - run
              print(f"{name}: run={run.isoformat()} âge={age}")
              limit = limits.get(name, timedelta(hours=30))
              if age > limit:
                  raise SystemExit(
                      f"Cycle {name} trop ancien ({age}) ; limite autorisée : {limit}."
                  )
          print("generatedAt:", manifest.get("generatedAt"))
          PY

      - name: Afficher les fichiers générés
        run: |
          find maps -type f -printf '%p %k Ko\n' | sort
          du -sh maps

      - name: Publier les cartes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add maps/

          if git diff --cached --quiet; then
            echo "Aucune modification de cartes à publier."
            exit 0
          fi

          git commit -m "chore(maps): update forecast maps"
          publish_with_rebase() {
            local branch="${GITHUB_REF_NAME:-main}"
            for attempt in 1 2 3 4 5; do
              echo "Tentative de publication ${attempt}/5 sur ${branch}"
              git pull --rebase origin "$branch"
              if git push origin "HEAD:$branch"; then
                return 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 8))
            done
            echo "Échec de la publication après 5 tentatives." >&2
            return 1
          }
          publish_with_rebase
          echo "Fin UTC : $(date -u --iso-8601=seconds)"
