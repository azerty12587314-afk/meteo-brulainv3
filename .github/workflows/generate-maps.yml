name: Generate Weather Maps

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate maps
        run: |
          python scripts/render_maps.py --output . --models gfs icon_eu ecmwf

      - name: Commit generated maps
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Mise à jour automatique des cartes météo"
