name: Build 1991-2020 climatology

on:
  workflow_dispatch:
    inputs:
      spacing:
        description: "Espacement de la grille en degrés (6 recommandé)"
        required: false
        default: "6"

permissions:
  contents: write

concurrency:
  group: climatology-generation
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Build climatology progressively
        env:
          GRID_SPACING: ${{ github.event.inputs.spacing || '6' }}
        run: |
          python scripts/build_climatology.py \
            --spacing "$GRID_SPACING" \
            --years-per-request 5 \
            --sleep 1.0 \
            --max-retries 8

      - name: Validate generated file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('climatology/europe_t2m_monthly.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert len(data['months']) == 12
          assert all(data['months'][str(month)]['values'] for month in range(1, 13))
          print(f"Climatology OK: {path.stat().st_size / 1024:.1f} KiB")
          PY

      - name: Commit climatology
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add climatology/europe_t2m_monthly.json
          if git diff --cached --quiet; then
            echo "No climatology changes."
          else
            git commit -m "chore: add resilient 1991-2020 climatology"
            git push
          fi
