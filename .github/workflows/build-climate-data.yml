name: Build climate data

on:
  workflow_dispatch:
  schedule:
    - cron: '15 4 1 * *'

permissions:
  contents: write

concurrency:
  group: build-climate-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Construire les données climatiques
        run: python scripts/build_climate_data.py
      - name: Publier la climatologie
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(data): update climate data'
          file_pattern: data/climate.json
