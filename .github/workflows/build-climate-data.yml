name: Build climate data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * *"
  push:
    paths:
      - "data/location.json"
      - "scripts/build_climate_data.py"
      - "scripts/validate_climate_data.py"
      - ".github/workflows/build-climate-data.yml"

permissions:
  contents: write

concurrency:
  group: build-climate-data
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install "requests>=2.32,<3"

      - name: Vérifier les fichiers requis
        run: |
          test -f data/location.json
          test -f scripts/build_climate_data.py
          test -f scripts/validate_climate_data.py
          python -m py_compile scripts/build_climate_data.py
          python -m py_compile scripts/validate_climate_data.py

      - name: Construire les données climatiques
        run: python scripts/build_climate_data.py

      - name: Vérifier climate.json
        run: python scripts/validate_climate_data.py

      - name: Afficher le résumé
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/climate.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          print("Localisation :", data["location"]["name"])
          print("Normales :", len(data["normals"]["monthly"]), "mois")
          print("Années récentes :", len(data["recentYears"]))
          print("Année courante :", data["currentYear"]["year"])
          print("Fichier :", path, "-", path.stat().st_size, "octets")
          PY

      - name: Publier climate.json
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(climate): update climate data"
          file_pattern: "data/climate.json"
