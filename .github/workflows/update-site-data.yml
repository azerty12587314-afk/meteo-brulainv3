name: Update site data

on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"

permissions:
  contents: write

concurrency:
  group: meteo-repository-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install requests

      - name: Build central weather cache
        run: python scripts/build_site_data.py

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/site-data.json observations/data.json

          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
            exit 0
          fi

          git commit -m "chore: update central site data"

          for attempt in 1 2 3; do
            echo "Tentative de publication $attempt/3"

            if ! git pull --rebase origin main; then
              echo "Échec du rebase."
              git rebase --abort || true
              sleep 15
              continue
            fi

            if git push origin HEAD:main; then
              echo "Publication réussie."
              exit 0
            fi

            echo "Nouvelle tentative dans 15 secondes."
            sleep 15
          done

          echo "Échec de la publication après trois tentatives."
          exit 1
