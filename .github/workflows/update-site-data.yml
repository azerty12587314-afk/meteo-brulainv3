name: Update site data

on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"

permissions:
  contents: write

concurrency:
  group: site-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install requests

      - name: Build central weather cache
        run: python scripts/build_site_data.py

      - name: Commit cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.json observations/data.json
          if git diff --cached --quiet; then
            echo "No site data changes."
          else
            git commit -m "chore: update central site data"
          publish_with_rebase() {
            local branch="${GITHUB_REF_NAME:-main}"
            for attempt in 1 2 3 4 5; do
              echo "Tentative de publication ${attempt}/5 sur ${branch}"
              git pull --rebase origin "$branch"
              if git push origin "HEAD:$branch"; then
                return 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 8))
            done
            echo "Échec de la publication après 5 tentatives." >&2
            return 1
          }
          publish_with_rebase
          fi
