name: Update observations

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: update-observations
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install -r scripts/requirements-data.txt
      - name: Mettre à jour les observations
        run: python scripts/update_observations.py
      - name: Publier les données
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(data): update observations'
          file_pattern: observations/data.json
