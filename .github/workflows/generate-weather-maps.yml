name: Generate weather maps

on:
  workflow_dispatch:
  schedule:
    - cron: '35 1,7,13,19 * * *'

permissions:
  contents: write

concurrency:
  group: generate-weather-maps
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install -r scripts/requirements-maps.txt
      - name: Générer ou actualiser les cartes
        run: python scripts/generate_weather_maps.py
      - name: Publier les cartes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(maps): update weather maps'
          file_pattern: maps
