<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Tableau de bord météo moderne pour Brûlain et toute autre ville.">
<meta name="theme-color" content="#0ea5e9">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<title>Météo Lab V2</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<header class="hero">
  <h1>🌤️ Météo Lab V2</h1>
  <p id="location">Brûlain</p>
  <div id="current-weather">
    <div id="weather-icon">☀️</div>
    <div id="temperature">--°C</div>
    <div id="description">Chargement...</div>
  </div>
</header>

<main>
<section id="dashboard">
  <div class="card" id="sun-card"></div>
  <div class="card" id="wind-card"></div>
  <div class="card" id="uv-card"></div>
  <div class="card" id="air-card"></div>
</section>

<section class="card">
<h2>Prévisions horaires</h2>
<div id="hourly"></div>
</section>

<section class="card">
<h2>Prévisions 7 jours</h2>
<div id="daily"></div>
</section>

<section class="card">
<h2>Comparaison des modèles</h2>
<canvas id="modelsChart"></canvas>
</section>

<section class="card">
<h2>Radar météo</h2>
<iframe id="ventusky" loading="lazy"></iframe>
</section>
</main>

<footer>
<p>Météo Lab V2 © 2026</p>
</footer>

<script defer src="js/config.js"></script>
<script defer src="js/api.js"></script>
<script defer src="js/weather.js"></script>
<script defer src="js/charts.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/animations.js"></script>
<script defer src="js/radar.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
