<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Météo Lab V6 — Navigation verticale</title>
  <link rel="stylesheet" href="css/model-player-v6.css">
</head>
<body>
<section class="weather-player" id="weatherPlayer">
  <button class="sidebar-toggle" id="sidebarToggle" type="button"
          aria-controls="weatherSidebar" aria-expanded="true"
          title="Afficher ou masquer la navigation">
    ☰
  </button>

  <aside class="weather-sidebar" id="weatherSidebar">
    <div class="sidebar-header">
      <div>
        <span class="eyebrow">Cartes météo</span>
        <h2>Modèles</h2>
      </div>
      <button class="sidebar-close" id="sidebarClose" type="button" aria-label="Fermer">×</button>
    </div>

    <div class="model-tabs" id="modelTabs" role="tablist" aria-label="Modèles météo"></div>

    <div class="timeline-heading">
      <span>Échéances</span>
      <span id="frameCount"></span>
    </div>
    <div class="timeline" id="timeline" role="listbox" aria-label="Échéances météo"></div>
  </aside>

  <main class="weather-stage">
    <header class="map-toolbar">
      <div>
        <span class="model-badge" id="modelBadge">GFS</span>
        <strong id="mapTitle">Carte météo</strong>
        <div class="map-meta" id="mapMeta">Chargement…</div>
      </div>

      <div class="player-controls">
        <button id="previousFrame" type="button" aria-label="Échéance précédente">⏮</button>
        <button id="playPause" type="button" aria-label="Lire l’animation">▶</button>
        <button id="nextFrame" type="button" aria-label="Échéance suivante">⏭</button>
        <label class="speed-control">
          <span>Vitesse</span>
          <select id="playSpeed" aria-label="Vitesse de lecture">
            <option value="1200">Lente</option>
            <option value="700" selected>Normale</option>
            <option value="350">Rapide</option>
          </select>
        </label>
      </div>
    </header>

    <div class="map-viewport" id="mapViewport">
      <div class="image-layer current">
        <img id="currentMap" alt="Carte météo">
      </div>
      <div class="image-layer next">
        <img id="nextMap" alt="">
      </div>

      <div class="map-loader" id="mapLoader" hidden>
        <span class="spinner"></span>
        <span>Chargement de la carte…</span>
      </div>

      <div class="map-error" id="mapError" hidden>
        Carte indisponible pour cette échéance.
      </div>

      <div class="hover-tooltip" id="hoverTooltip" hidden></div>
    </div>

    <footer class="mobile-timeline">
      <input id="mobileRange" type="range" min="0" max="0" value="0" step="1"
             aria-label="Choisir une échéance">
      <output id="mobileOutput">+0 h</output>
    </footer>
  </main>
</section>

<script src="js/model-player-v6.js"></script>
</body>
</html>
