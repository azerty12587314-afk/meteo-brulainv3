name: Generate weather maps

on:
  workflow_dispatch:
    inputs:
      max_hour:
        description: "Échéance maximale en heures"
        required: false
        default: "120"
  schedule:
    - cron: "35 1,7,13,19 * * *"

permissions:
  contents: write

concurrency:
  group: weather-map-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements-maps.txt

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-maps.txt

      - name: Generate GFS and ICON-EU maps
        env:
          MAX_HOUR: ${{ github.event.inputs.max_hour || '120' }}
        run: |
          python scripts/render_maps.py \
            --output . \
            --models gfs icon_eu \
            --max-hour "$MAX_HOUR" \
            --step 6

      - name: Generate ECMWF, AROME and ARPEGE advanced maps
        continue-on-error: true
        run: |
          python scripts/render_openmeteo_models.py --output . --models ecmwf arpege arome

      - name: Add CAPE, jet stream and Z500 for GFS and ICON
        continue-on-error: true
        run: |
          python scripts/render_openmeteo_models.py --output . --models gfs icon_eu

      - name: Show generated files
        run: |
          find maps -maxdepth 4 -type f | sort
          du -sh maps

      - name: Commit generated maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maps
          if git diff --cached --quiet; then
            echo "No map changes to commit."
          else
            git commit -m "chore: update V8 multi-model weather maps"
            git push
          fi
